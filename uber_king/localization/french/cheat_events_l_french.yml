  blessed.d: "Voulez-vous ajouter ou supprimer les traits de l'Étranger d'un Autre Monde ?"
  blessed.a: "Ajouter les traits de l'Étranger d'un Autre Monde"
  blessed.b: "Supprimer les traits de l'Étranger d'un Autre Monde"
  blessed.tooltip.add: "Cela ajoutera tous les traits de l'Étranger d'un Autre Monde à votre personnage."
  blessed.tooltip.remove: "Cela supprimera tous les traits de l'Étranger d'un Autre Monde de votre personnage."

