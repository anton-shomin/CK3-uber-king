l_french:
  trait_popadanets_core_traits: "Étranger d'un Autre Monde"
  trait_popadanets_core_traits_desc: "'J'ai eu la malchance de naître dans ce siècle', pensais-je souvent. Mes intérêts pour l'histoire, les arts martiaux et l'escrime, ainsi que mes opinions religieuses, rendaient difficile mon adaptation à ce monde. Un travail décent me permettait de m'adonner à mes passions. Une vie rude, des années d'adolescence remplies de bagarres et de coups de couteau, la capacité d'organiser n'importe quoi, la ruse, des compétences en hypnose, une passion pour le MMA et l'escrime historique - tout cela me sera utile dans ce nouveau monde."

  trait_combat_genius: "Génie du combat"
  trait_combat_genius_desc: "Ce personnage s'adapte superbement à n'importe quel terrain, tirant le maximum d'avantages de l'environnement."

  trait_warfare_genius: "Génie militaire"
  trait_warfare_genius_desc: "L'esprit stratégique de ce personnage lui permet de trouver des solutions inattendues dans les situations militaires les plus difficiles."
