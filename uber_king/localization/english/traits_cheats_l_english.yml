l_english:
  trait_popadanets_core_traits: "Otherworldly Stranger"
  trait_popadanets_core_traits_desc: "'I was unlucky to be born in this century,' I often thought. My interests in history, martial arts, and fencing, along with my religious views, made it hard to fit into that world. A decent job did allow me to indulge my passions. A harsh life, teenage years filled with brawls and knife fights, the ability to organize anything, cunning, hypnosis skills, a passion for MMA and historical fencing – all this will serve me well in this new world."

  trait_combat_genious: "Combat Genius"
  trait_combat_genious_desc: "This character adapts superbly to any terrain, gaining maximum advantage from the environment."

  trait_warfare_genius: "Military Genius"
  trait_warfare_genius_desc: "This character's strategic mind allows them to find unexpected solutions in the most difficult military situations."
