l_spanish:
  trait_popadanets_core_traits: "Extraño de Otro Mundo"
  trait_popadanets_core_traits_desc: "'Tuve la mala suerte de nacer en este siglo', pensaba a menudo. Mis intereses en historia, artes marciales y esgrima, junto con mis puntos de vista religiosos, hicieron que me costara encajar en ese mundo. Un trabajo decente me permitía dedicarme a mis pasiones. Una vida dura, años de adolescencia llenos de peleas y navajazos, la habilidad para organizar cualquier cosa, astucia, habilidades de hipnosis, una pasión por el MMA y la esgrima histórica: todo esto me servirá bien en este nuevo mundo."

  trait_combat_genius: "Genio del combate"
  trait_combat_genius_desc: "Este personaje se adapta de forma excepcional a cualquier terreno, obteniendo la máxima ventaja del entorno."

  trait_warfare_genius: "Genio militar"
  trait_warfare_genius_desc: "La mente estratégica de este personaje le permite encontrar soluciones inesperadas en las situaciones militares más difíciles."
